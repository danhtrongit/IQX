[workspace]
resolver = "3"
members = ["app", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
api = { path = "crates/api" }
chart = { path = "crates/chart" }
indicator = { path = "crates/indicator" }
model = { path = "crates/model" }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
