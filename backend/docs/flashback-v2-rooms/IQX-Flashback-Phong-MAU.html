<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IQX · Flashback phòng chơi</title>
<style>
:root{color-scheme:dark;--page:#0a1018;--panel:#0e151f;--surface:#121b27;--surface2:#172231;--field:#192332;--line:#293747;--text:#e7eff9;--soft:#c9d6e4;--blue:#249bec;--bluebg:#132c43;--green:#42c99e;--greenbg:#142e29;--red:#f27d88;--redbg:#3a1d24;--gold:#dfb969;--violet:#b99cff;--top:54px;--side:360px;--rail:86px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-rows:var(--top) 1fr;height:100vh}
.topbar{display:flex;align-items:center;background:var(--surface);border-bottom:1px solid var(--line);padding:0 14px 0 12px;gap:18px;white-space:nowrap}
.brand{display:flex;align-items:center;gap:5px;font-size:19px;font-weight:850;letter-spacing:-.6px;padding-right:20px;border-right:1px solid var(--line);height:28px}
.brand i{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--green)}
.nav{display:flex;height:100%}
.nav a{display:flex;align-items:center;padding:0 14px;font-size:13px;font-weight:700;color:#dbe7f3;text-decoration:none;letter-spacing:.2px}
.nav a.on{background:var(--blue);color:#fff;box-shadow:inset 0 -3px 0 #7cc8ff}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.xu{display:flex;align-items:center;gap:7px;border:1px solid #6b5a2c;background:#2a2312;color:var(--gold);border-radius:6px;padding:6px 11px;font-weight:750}
.xu b{width:15px;height:15px;border:1.5px solid var(--gold);border-radius:50%;display:inline-block}
.find{border:1px solid var(--line);border-radius:6px;padding:7px 13px;font-weight:650}
.body{display:grid;grid-template-columns:1fr var(--side) var(--rail);min-height:0}
.main{min-width:0;min-height:0;overflow:auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.side{border-left:1px solid var(--line);background:var(--panel);min-height:0;overflow:auto;display:flex;flex-direction:column}
.rail{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:6px}
.rail .rh{font-size:11px;font-weight:800;letter-spacing:1px;color:#dbe7f3;margin:10px 0 14px}
.rail a{width:74px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;border-radius:8px;font-size:12px;font-weight:650;color:#dbe7f3;text-decoration:none;border-left:3px solid transparent}
.rail a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
.rail a.on{background:var(--bluebg);color:#fff;border-left-color:var(--blue)}

/* head */
.ghead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.gname{font-size:24px;font-weight:850;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
.gname svg{width:26px;height:26px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px}
.chip.hot{border-color:#6b5a2c;background:#2a2312;color:var(--gold)}
.ghead .sp{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cd{font-variant-numeric:tabular-nums}

.stats{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:10px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;min-width:0}
.st span{display:block;font-size:12px;font-weight:700;color:var(--soft);margin-bottom:5px}
.st b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.st .bar{height:6px;border-radius:4px;background:var(--field);margin-top:9px;overflow:hidden}
.st .bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .25s}
.up{color:var(--green)}.dn{color:var(--red)}

.chartbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:420px}
.ctop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:relative}
.fxb{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--field);border-radius:7px;padding:6px 11px;font-weight:750;font-size:13px}
.fxb:hover,.fxb.on{border-color:var(--blue)}
.fxb i{font-family:Georgia,serif;font-size:15px;font-style:italic}
.fxb i sub{font-size:10px}
.fxm{position:absolute;top:38px;left:0;z-index:15;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:250px;box-shadow:0 12px 30px #0008}
.fxm[hidden]{display:none}
.fxm h4{font-size:12px;font-weight:800;padding:6px 10px 8px;letter-spacing:.3px}
.fxm button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;border-radius:7px;padding:9px 10px;font-weight:700;text-align:left}
.fxm button:hover{background:var(--field)}
.fxm button i{width:12px;height:3px;border-radius:2px}
.fxm button b{margin-left:auto;color:var(--green);font-weight:850}
.inds{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.act{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:7px;padding:4px 6px 4px 10px;font-weight:700;font-size:12.5px}
.act i{width:10px;height:3px;border-radius:2px}
.act button{border:0;background:none;width:20px;height:20px;border-radius:5px;font-size:15px;line-height:1}
.act button:hover{background:var(--field)}
.act button{display:flex;align-items:center;justify-content:center}
.cfgm{width:min(420px,100%)}
.cfgm h2{margin-bottom:14px}
.cfgf{display:flex;flex-direction:column;gap:12px;margin-bottom:6px}
.cfgf label{display:grid;grid-template-columns:1fr 110px;grid-template-rows:auto auto;column-gap:12px;align-items:center}
.cfgf label span{font-weight:700}
.cfgf label small{grid-column:2;font-size:12px;color:var(--soft);text-align:right;margin-top:3px}
.cfgf input{grid-row:1/2;grid-column:2;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-weight:750;font-size:15px;width:100%;outline:none;text-align:right}
.cfgf input:focus{border-color:var(--blue)}
.fld input:disabled{opacity:.5}
.pcts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 10px}
.pcts button{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:10px 0;font-weight:850;font-variant-numeric:tabular-nums}
.pcts button.on{border-color:var(--blue);background:var(--bluebg);color:#fff}
.pcts button:disabled{opacity:.45;cursor:default}
.ind{border:1px solid var(--line);background:var(--field);border-radius:7px;padding:5px 10px;font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px}
.ind i{width:10px;height:3px;border-radius:2px;display:inline-block}
.ind.on{border-color:var(--blue);background:var(--bluebg);color:#fff}
.ind.lock{border-style:dashed;color:#dbe7f3;background:transparent}
.ind.lock svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.ohlc{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--soft);min-height:18px}
.ohlc b{color:var(--text);font-weight:750}
.ohlc .ph{color:#fff;font-weight:800}
.cwrap{position:relative;flex:1;min-height:360px;display:flex;overflow:hidden}
#chart{width:100%;flex:1;min-height:360px;display:block;touch-action:pan-y}
.legend{position:absolute;inset:0;pointer-events:none}
.lgp{position:absolute;left:8px;right:70px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.lg{display:flex;align-items:center;gap:8px;pointer-events:auto;font-size:12.5px;padding:2px 6px;border-radius:6px;border:1px solid transparent;font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%}
.lg:hover{border-color:var(--line);background:#0e151fe6}
.lg .lt{font-weight:750;color:var(--text)}
.lg .lv{font-weight:700}
.lg.off .lt,.lg.off .lv{opacity:.45}
.lg .lb{display:none;gap:2px}
.lg:hover .lb,.lg.tap .lb{display:flex}
.lg .lb button{border:0;background:none;width:24px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#dbe7f3}
.lg .lb button:hover{background:var(--field);color:#fff}
.lg .lb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
.lg.head{font-size:13px;white-space:normal;flex-wrap:wrap;column-gap:8px;row-gap:0}
.lg.head .lt{font-weight:800}
@media (hover:none){.lg .lb{display:flex}}
.tvm{width:min(480px,100%);padding:0;overflow:hidden}
.tvh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.tvh h2{font-size:18px;margin:0}
.tvh .x{border:0;background:none;font-size:24px;line-height:1;width:32px;height:32px;border-radius:6px}
.tvh .x:hover{background:var(--field)}
.srch{padding:12px 18px;border-bottom:1px solid var(--line)}
.srch input{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none}
.srch input:focus{border-color:var(--blue)}
.tvsub{padding:12px 18px 6px;font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--soft)}
.ilist{max-height:min(460px,60vh);overflow:auto;padding:8px 8px 10px}
.ilist button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:11px 10px;border-radius:7px;text-align:left;font-weight:700}
.ilist button:hover{background:var(--field)}
.ilist button i{width:14px;height:3px;border-radius:2px}
.ilist button small{margin-left:auto;font-size:12px;color:var(--soft);font-weight:650}
.cfgm.tvm .cfgf{padding:16px 18px 4px}
.tvtabs{display:flex;gap:18px;padding:0 18px;border-bottom:1px solid var(--line)}
.tvtabs span{padding:11px 0;font-weight:800;border-bottom:2px solid var(--blue)}
.tvf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.tvf div{display:flex;gap:8px}
.tvf button{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:9px 16px;font-weight:800}
.tvf button.p{background:var(--blue);border-color:var(--blue);color:#fff}
.cfgm.tvm .err{padding:0 18px}
#chart text{font-size:11px;fill:#c9d6e4;font-variant-numeric:tabular-nums}
#chart .new{animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

.next{display:flex;gap:10px;align-items:center}
.btn-next{flex:1;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:800;font-size:17px;padding:15px 20px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 18px #249bec33}
.btn-next:hover{background:#3aa8f0}
.btn-next:disabled{background:#24344a;color:#dbe7f3;box-shadow:none;cursor:default}
.btn-next kbd{font:inherit;font-size:12px;border:1px solid #ffffff66;border-radius:5px;padding:1px 6px;font-weight:700}
.qb{display:none;border:0;border-radius:10px;padding:15px 16px;font-weight:850}.qb.buy{background:var(--green);color:#06231b}.qb.sell{background:var(--red);color:#2a0b10}
.btn-next.fin{background:var(--green);color:#06231b;box-shadow:0 6px 18px #42c99e33}

/* side */
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{border:0;background:none;padding:14px 0;font-weight:800;color:#dbe7f3;border-bottom:2px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:var(--blue)}
.pane{padding:14px;display:flex;flex-direction:column;gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 13px}
.box h3{font-size:13px;font-weight:800;margin-bottom:9px;letter-spacing:.2px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-variant-numeric:tabular-nums}
.kv span{color:var(--soft)}
.kv b{font-weight:750}
.kv.big b{font-size:17px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:8px;padding:3px;margin-bottom:11px}
.seg button{border:0;background:none;border-radius:6px;padding:8px 0;font-weight:800;color:#dbe7f3}
.seg button.on.buy{background:var(--green);color:#06231b}
.seg button.on.sell{background:var(--red);color:#2a0b10}
.fld{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.fld label{font-size:12px;font-weight:700;color:var(--soft)}
.fld .inp{display:flex;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fld .inp:focus-within{border-color:var(--blue)}
.fld input{flex:1;min-width:0;border:0;background:none;padding:10px 11px;font-size:16px;font-weight:750;outline:none;font-variant-numeric:tabular-nums}
.fld .inp span{padding:0 11px;font-weight:700;color:var(--soft)}
.err{color:var(--red);font-size:12.5px;font-weight:650;min-height:16px}
.btn-ord{width:100%;border:0;border-radius:8px;padding:12px;font-weight:850;font-size:15px;margin-top:4px}
.btn-ord.buy{background:var(--green);color:#06231b}
.btn-ord.sell{background:var(--red);color:#2a0b10}
.btn-ord:disabled{background:#24344a;color:#dbe7f3;cursor:default}
.hold{display:flex;flex-direction:column;gap:6px}
.lot{display:flex;justify-content:space-between;align-items:center;background:var(--field);border-radius:7px;padding:8px 10px;font-variant-numeric:tabular-nums;font-size:13px}
.tag{font-size:11.5px;font-weight:800;border-radius:5px;padding:2px 7px}
.tag.ok{background:var(--greenbg);color:var(--green)}
.tag.wait{background:#2a2312;color:var(--gold)}
.empty{color:var(--soft);font-size:13px}
.ords{display:flex;flex-direction:column;gap:5px;max-height:220px;overflow:auto}
.ord{display:grid;grid-template-columns:58px 1fr auto;gap:8px;font-size:12.5px;padding:6px 2px;border-bottom:1px solid #1f2a38;font-variant-numeric:tabular-nums}
.ord:last-child{border:0}
.ord .s{font-weight:850}
.lb .row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:8px 6px;border-radius:7px;font-variant-numeric:tabular-nums}
.lb .row:nth-child(-n+3) .rk{color:var(--gold)}
.lb .row.me{background:var(--bluebg);outline:1px solid var(--blue)}
.lb .rk{font-weight:850;text-align:center}
.lb .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .gap{text-align:center;color:var(--soft);padding:2px 0}
.seg2{display:flex;gap:6px;margin-bottom:10px}
.seg2 button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 12px;font-weight:750;font-size:12.5px}
.seg2 button.on{border-color:var(--blue);background:var(--bluebg);color:#fff}
.prev .kv b{font-weight:800}
.mock select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--text);font:inherit;font-weight:700}
.empty0{padding:18px 12px;font-weight:650;line-height:1.6;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty0 button{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:9px 14px;font-weight:800}
.reset{border:1px dashed var(--line);background:none;border-radius:8px;padding:9px;font-weight:700;color:#dbe7f3}

/* modal */
.mask{position:fixed;inset:0;background:#05090fcc;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mask[hidden],.pane[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px}
.modal h2{font-size:22px;font-weight:850;margin-bottom:4px}
.modal .sub{color:var(--soft);font-weight:650;margin-bottom:16px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.res .st b{font-size:24px}
.strip{display:flex;gap:5px;margin:4px 0 14px}
.strip i{flex:1;height:26px;border-radius:5px}
.strip i.g{background:var(--green)}.strip i.r{background:var(--red)}.strip i.n{background:#3a4b60}
.xubox{display:flex;flex-direction:column;gap:2px;background:#2a2312;border:1px solid #6b5a2c;border-radius:10px;padding:12px 14px;margin-bottom:14px}
.xubox .kv span{color:#f3dfae}
.xubox .kv b{color:var(--gold)}
.join{position:absolute;inset:0;z-index:12;background:#0a1018d9;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:16px}
.join[hidden]{display:none}
.jcard{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.jcard h2{font-size:21px;font-weight:850}
.jcard .btn-join{border:0;border-radius:10px;background:var(--gold);color:#2a1f05;font-weight:850;font-size:16px;padding:14px}
.rw .kv b{color:var(--gold)}
.reveal{background:var(--field);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-weight:650}
.mact{display:flex;gap:10px;flex-wrap:wrap}
.mact button{flex:1;border:0;border-radius:9px;padding:12px;font-weight:850}
.mact .p{background:var(--blue);color:#fff}
.mact .g{background:var(--field);border:1px solid var(--line)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--green);color:#06231b;font-weight:800;padding:10px 16px;border-radius:9px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

@media (max-width:1100px){:root{--side:320px}}

@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh}
  .nav,.find{display:none}
  .body{grid-template-columns:1fr}
  .rail{display:none}
  .main{overflow:visible;padding:12px 12px 88px}
  .side{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .tabs{position:static}
  .gname{font-size:21px}
  .ghead .sp{margin-left:0}
  .chartbox{min-height:0;padding:8px}
  #chart{min-height:300px;height:380px}
  .cwrap{min-height:380px}
  .stats{grid-template-columns:1fr 1fr}
  .chartbox{min-height:470px}
  .jcard{padding:16px}
  .next{position:fixed;left:0;right:0;bottom:0;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line);z-index:20}
  .st b{font-size:17px}
  .qb{display:block}
  .btn-next kbd{display:none}
}
/* ===== Phòng chơi ===== */
.body.lobby{grid-template-columns:1fr var(--rail)}
.body.lobby .side{display:none}
.view[hidden]{display:none!important}
.lob{display:flex;flex-direction:column;gap:14px;max-width:1080px;width:100%}
.lbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lbar .srchr{display:flex;flex:1;min-width:240px;background:var(--field);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lbar .srchr:focus-within{border-color:var(--blue)}
.lbar .srchr input{flex:1;min-width:0;border:0;background:none;padding:11px 12px;font-weight:700;outline:none;font-size:15px;letter-spacing:.5px}
.lbar .srchr button{border:0;background:var(--blue);color:#fff;font-weight:800;padding:0 16px}
.bt{border:1px solid var(--line);background:var(--field);border-radius:9px;padding:11px 16px;font-weight:800;white-space:nowrap}
.bt.p{background:var(--blue);border-color:var(--blue);color:#fff}
.bt.g{background:var(--gold);border-color:var(--gold);color:#2a1f05}
.bt:disabled{opacity:.5;cursor:default}
.rooms{display:flex;flex-direction:column;gap:8px}
.rm{display:grid;grid-template-columns:96px 1fr 180px 100px 100px 120px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.rm.hd{background:none;border:0;padding:0 14px;font-size:12px;font-weight:800;color:var(--soft)}
.rm .id{font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.rm .id svg{width:14px;height:14px;stroke:var(--gold);fill:none;stroke-width:2}
.rm .own{display:flex;align-items:center;gap:9px;min-width:0;font-weight:750}
.rm .own span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm .bet{color:var(--gold);font-weight:800}
.rm .ract{display:flex;justify-content:flex-end}

<script>
'use strict';
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('vi-VN');
const num=(x,d)=>x.toFixed(d).replace('.',',');
const pct=x=>(x>=0?'+':'')+num(x,2)+'%';
const pct1=x=>(x>=0?'+':'')+num(x,1)+'%';
const cls=x=>x>0.0001?'up':x<-0.0001?'dn':'';
const CAP=10000000,FEE=0.0015,TAX=0.001;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ===== Ví xu (bản mẫu lưu trên trình duyệt) ===== */
const WKEY='iqx_fb_room_wallet';let Wl={xu:1250,learned:5};
try{const v=JSON.parse(localStorage.getItem(WKEY)||'null');if(v&&typeof v.xu==='number')Wl=Object.assign(Wl,v)}catch(e){}
const saveW=()=>{try{localStorage.setItem(WKEY,JSON.stringify(Wl))}catch(e){}};
const save=()=>{};

/* ===== Dữ liệu của phòng: một mã VN30 và một giai đoạn chọn ngẫu nhiên, khớp số phiên xem + số phiên chơi.
   Bản mẫu tự sinh giá theo seed; bản thật lấy từ server, mỗi lần một nến ===== */
let H=60,P=30,N=90,M=350;const WU=260;
let FO,FH,FL,FC,FV,TP,O,Hh,L,C,V;
function genData(seed){
  const R=rng(seed);N=H+P;M=WU+N;
  const gauss=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  const tick=p=>p<10000?10:p<50000?50:100,rnd=p=>Math.round(p/tick(p))*tick(p);
  FO=[];FH=[];FL=[];FC=[];FV=[];
  let prev=rnd(15000+R()*95000),k=0;const baseV=600000+R()*2400000;
  while(k<M){const len=6+Math.floor(R()*14),mu=-0.011+R()*0.023,sd=0.011+R()*0.015;
   for(let j=0;j<len&&k<M;j++,k++){
    let r=mu+sd*gauss();r=Math.max(-0.068,Math.min(0.068,r));
    const o=rnd(prev*(1+0.25*sd*gauss())),c=rnd(prev*(1+r));
    const hi=rnd(Math.max(o,c)*(1+Math.abs(sd*0.55*gauss()))),lo=rnd(Math.min(o,c)*(1-Math.abs(sd*0.55*gauss())));
    const cap=rnd(prev*1.07),flo=rnd(prev*0.93);
    FO.push(Math.min(cap,Math.max(flo,o)));FC.push(Math.min(cap,Math.max(flo,c)));FH.push(Math.min(cap,Math.max(hi,o,c)));FL.push(Math.max(flo,Math.min(lo,o,c)));
    FV.push(Math.round(baseV*(0.6+0.8*R())*(1+Math.abs(r)*28)/100)*100);prev=FC[k];}}
  const fct=(18000+R()*70000)/FC[WU];[FO,FH,FL,FC].forEach(A=>A.forEach((x,i)=>A[i]=rnd(x*fct)));
  O=FO.slice(WU);Hh=FH.slice(WU);L=FL.slice(WU);C=FC.slice(WU);V=FV.slice(WU);
  TP=FC.map((c,i)=>(FH[i]+FL[i]+c)/3);SC={};
}
const sma=(a,n)=>a.map((_,i)=>{if(i<n-1)return null;let s=0;for(let j=i-n+1;j<=i;j++){if(a[j]==null)return null;s+=a[j]}return s/n});
const emaS=(a,n)=>{const k=2/(n+1),out=[];let e=null,buf=[];a.forEach(x=>{if(x==null){out.push(null);e=null;buf=[];return}if(e==null){buf.push(x);if(buf.length===n){e=buf.reduce((s,y)=>s+y,0)/n;out.push(e)}else out.push(null)}else{e=x*k+e*(1-k);out.push(e)}});return out};
const win=(i,n,f)=>{if(i<n-1)return null;return f(i-n+1,i)};
const mx=(a,s,e)=>{let m=-1e18;for(let j=s;j<=e;j++)m=Math.max(m,a[j]);return m},mn=(a,s,e)=>{let m=1e18;for(let j=s;j<=e;j++)m=Math.min(m,a[j]);return m};
const CALC={
 vol:p=>({a:FV.map((_,i)=>i<p.lookback?null:p.mult*FV.slice(i-p.lookback,i).reduce((s,x)=>s+x,0)/p.lookback)}),
 ma:p=>({a:sma(FC,p.period)}),
 ema:p=>({a:emaS(FC,p.period)}),
 mac:p=>({f:sma(FC,p.fast),s:sma(FC,p.slow)}),
 bb:p=>{const m=sma(FC,p.period),u=[],l=[];FC.forEach((_,i)=>{if(m[i]==null){u.push(null);l.push(null);return}let s=0;for(let j=i-p.period+1;j<=i;j++)s+=(FC[j]-m[i])**2;const d=Math.sqrt(s/p.period);u.push(m[i]+p.k*d);l.push(m[i]-p.k*d)});return{m,u,l}},
 don:p=>({u:FH.map((_,i)=>i<p.period?null:mx(FH,i-p.period,i-1)),l:FL.map((_,i)=>i<p.period?null:mn(FL,i-p.period,i-1))}),
 rsi:p=>{const n=p.period,a=Array(M).fill(null);let g=0,l=0;
   for(let i=1;i<M;i++){const d=FC[i]-FC[i-1],u=Math.max(d,0),w=Math.max(-d,0);
     if(i<=n){g+=u;l+=w;if(i===n){g/=n;l/=n;a[i]=g+l?100*g/(g+l):null}}else{g=(g*(n-1)+u)/n;l=(l*(n-1)+w)/n;a[i]=g+l?100*g/(g+l):null}}return{a}},
 macd:p=>{const ef=emaS(FC,p.fast),es=emaS(FC,p.slow),a=FC.map((_,i)=>ef[i]==null||es[i]==null?null:ef[i]-es[i]),s=emaS(a,p.signal);return{a,s,h:a.map((x,i)=>x==null||s[i]==null?null:x-s[i])}},
 dmi:p=>{const n=p.period,P=Array(M).fill(null),Mn=Array(M).fill(null);let sp=0,sm=0,st=0;
   for(let i=1;i<M;i++){const up=FH[i]-FH[i-1],dn=FL[i-1]-FL[i],pd=up>dn&&up>0?up:0,md=dn>up&&dn>0?dn:0,tr=Math.max(FH[i]-FL[i],Math.abs(FH[i]-FC[i-1]),Math.abs(FL[i]-FC[i-1]));
     if(i<=n){sp+=pd;sm+=md;st+=tr}else{sp=sp-sp/n+pd;sm=sm-sm/n+md;st=st-st/n+tr}
     if(i>=n&&st>0){P[i]=100*sp/st;Mn[i]=100*sm/st}}return{p:P,m:Mn}},
 sto:p=>{const raw=FC.map((c,i)=>win(i,p.k,(s,e)=>{const h=mx(FH,s,e),l=mn(FL,s,e);return h===l?null:100*(c-l)/(h-l)})),k=sma(raw,p.smooth);return{k,d:sma(k,p.d)}},
 cci:p=>{const m=sma(TP,p.period);return{a:TP.map((t,i)=>{if(m[i]==null)return null;let s=0;for(let j=i-p.period+1;j<=i;j++)s+=Math.abs(TP[j]-m[i]);const md=s/p.period;return md?(t-m[i])/(0.015*md):null})}},
 roc:p=>({a:FC.map((c,i)=>i<p.period?null:(c/FC[i-p.period]-1)*100)}),
 wr:p=>({a:FC.map((c,i)=>win(i,p.period,(s,e)=>{const h=mx(FH,s,e),l=mn(FL,s,e);return h===l?null:-100*(h-c)/(h-l)}))}),
 obv:p=>{const a=[0];for(let i=1;i<M;i++)a.push(a[i-1]+(FC[i]>FC[i-1]?FV[i]:FC[i]<FC[i-1]?-FV[i]:0));return{a,b:sma(a,p.baseline)}},
 mfi:p=>{const pos=TP.map((t,i)=>i&&t>TP[i-1]?t*FV[i]:0),neg=TP.map((t,i)=>i&&t<TP[i-1]?t*FV[i]:0);
   return{a:FC.map((_,i)=>i<p.period?null:(()=>{let a=0,b=0;for(let j=i-p.period+1;j<=i;j++){a+=pos[j];b+=neg[j]}return a+b?100*a/(a+b):null})())}},
 cmf:p=>{const mfv=FC.map((c,i)=>FH[i]===FL[i]?null:((2*c-FH[i]-FL[i])/(FH[i]-FL[i]))*FV[i]);
   return{a:FC.map((_,i)=>win(i,p.period,(s,e)=>{let a=0,v=0;for(let j=s;j<=e;j++){if(mfv[j]==null)return null;a+=mfv[j];v+=FV[j]}return v?a/v:null}))}}

  let h=`<div class="lgp" style="top:${PANES.p.ly}px"><div class="lg head"><span class="lt">${lab}</span><span>O<b class="${cc}">${fmt(O[i])}</b> H<b class="${cc}">${fmt(Hh[i])}</b> L<b class="${cc}">${fmt(L[i])}</b> C<b class="${cc}">${fmt(C[i])}</b> <b class="${cls(ch)}">${pct(ch)}</b></span></div>`;
  S.ind.filter(t=>DI(t.k).kind==='over').forEach(t=>{h+=lgRow(t,lgVals(t,i))});
  h+=`</div><div class="lgp" style="top:${PANES.v.ly}px"><div class="lg"><span class="lt">Khối lượng</span><span class="lv up">${fmt(V[i])}</span></div>`;
  S.ind.filter(t=>DI(t.k).kind==='vol').forEach(t=>{h+=lgRow(t,lgVals(t,i))});
  h+='</div>';
  S.ind.filter(t=>DI(t.k).kind==='pane').forEach(t=>{h+=`<div class="lgp" style="top:${PANES['i'+t.id].ly}px">`+lgRow(t,lgVals(t,i))+'</div>'});
  $('legend').innerHTML=h;
  $('legend').querySelectorAll('.lg[data-id]').forEach(r=>{const id=+r.dataset.id;
    r.onclick=e=>{const b=e.target.closest('button');if(!b){r.classList.toggle('tap');return}const t=S.ind.find(x=>x.id===id),a=b.dataset.a;
      if(a==='hide'){t.hide=!t.hide;save();draw(false)}else if(a==='del'){S.ind=S.ind.filter(x=>x.id!==id);save();draw(false)}else openCfg(id)}})}

function lgVals(t,i){const d=DI(t.k),c=ser(t),col=colOf(t);return d.vals.map(([key,cc,f])=>{const v=c[key][i];const color=cc==='hist'?((v||0)>=0?'#42c99e':'#f27d88'):(cc||col);return `<span class="lv" style="color:${color}">${v==null?'—':f(v)}</span>`}).join('')}

(()=>{const r=rng(20261029);const pick=a=>a[Math.floor(r()*a.length)];
  for(let i=0;i<9;i++){const max=[2,2,3,4,4,4,1][Math.floor(r()*7)],own=FRIENDS[(i+2)%FRIENDS.length];const n=max===1?1:1+Math.floor(r()*max);

let flt='all',RM=null,G=null;

function view(v){['vLobby','vWait','vGame'].forEach(x=>$(x).hidden=x!==v);$('body').classList.toggle('lobby',v!=='vGame');if(v==='vGame')requestAnimationFrame(()=>draw(false))}

  $('rooms').innerHTML=`<div class="rm hd"><span>ID phòng</span><span>Chủ phòng</span><span>Phiên xem / chơi · giờ</span><span>Người chơi</span><span>Cược</span><span></span></div>`+
   list.map(r=>`<div class="rm"><span class="id">${r.id}${r.pw?LOCK:''}</span><span class="own">${av(r.owner)}<span>${r.owner.name}</span></span>
    <span class="cfg"><span>${r.H} / ${r.P} phiên · ${r.mins} phút</span><span>${r.n}/${r.max} người</span><span class="bet">${r.bet?fmt(r.bet)+' xu':'Không cược'}</span></span>
    <span class="ract">${r.state==='play'?'<span class="stt p">Đang chơi</span>':r.n>=r.max?'<span class="stt p">Đủ người</span>':`<button class="bt p" data-id="${r.id}">Vào</button>`}</span></div>`).join('')
   +(list.length?'':'<div class="empty" style="padding:14px">Không có phòng phù hợp</div>');
  $('rooms').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>tryJoin(ROOMS.find(r=>r.id===b.dataset.id)));

document.querySelectorAll('#flt button').forEach(b=>b.onclick=()=>{flt=b.dataset.f;document.querySelectorAll('#flt button').forEach(x=>x.classList.toggle('on',x===b));renderLobby()});
$('bFind').onclick=()=>{const id=$('qId').value.trim();if(!/^\d{6}$/.test(id)){toast('ID phòng gồm 6 chữ số');return}
  const r=ROOMS.find(x=>x.id===id);if(!r){toast('Không tìm thấy phòng '+id);return}tryJoin(r)};
$('qId').onkeydown=e=>{if(e.key==='Enter')$('bFind').click()};
$('bRand').onclick=()=>{const ok=ROOMS.filter(r=>r.state==='wait'&&!r.pw&&r.n<r.max&&r.bet<=Wl.xu);if(!ok.length){toast('Chưa có phòng mở phù hợp, hãy tạo phòng');return}tryJoin(ok[Math.floor(Math.random()*ok.length)],true)};

function tryJoin(r,skipPw){

  if(r.pw&&!skipPw){askPw(r);return}
  enterRoom(r,false)}
function askPw(r){$('modal').innerHTML=`<div class="mhead"><h2>Phòng ${r.id}</h2><button class="x" id="mX">×</button></div><div class="fm"><label>Mật khẩu phòng<input id="pw" type="password" autocomplete="off"><small>Bản mẫu: mật khẩu các phòng có khoá là 1234</small></label><div class="err" id="pwErr"></div></div><div class="mact"><button class="g" id="pwC">Hủy</button><button class="p" id="pwOk">Vào phòng</button></div>`;
  $('mask').hidden=false;setTimeout(()=>$('pw').focus(),30);
  $('mX').onclick=$('pwC').onclick=()=>$('mask').hidden=true;
  $('pwOk').onclick=()=>{if($('pw').value!==r.pw){$('pwErr').textContent='Mật khẩu không đúng';return}$('mask').hidden=true;enterRoom(r,false)};
  $('pw').onkeydown=e=>{if(e.key==='Enter')$('pwOk').click()}}

/* --- Tạo phòng --- */
$('bCreate').onclick=()=>{
  $('modal').innerHTML=`<div class="mhead"><h2>Tạo phòng</h2><button class="x" id="mX">×</button></div>
  <div class="fm">
    <div class="row2"><label>Số phiên xem<input id="fH" type="number" min="30" max="120" step="1" value="60"></label>

    <div class="row2"><label>Xu cược mỗi người<input id="fB" type="number" min="10" step="10" value="100"></label>

  </div>
  <div class="mact"><button class="g" id="fC">Hủy</button><button class="p" id="fOk">Tạo phòng</button></div>`;

    if(!Number.isInteger(h)||h<30||h>120)e='Số phiên xem phải từ 30 đến 120';
    else if(!Number.isInteger(p)||p<30||p>120)e='Số phiên chơi phải từ 30 đến 120';
    else if(n>1&&(!Number.isInteger(b)||b<10||b%10))e='Số xu cược tối thiểu 10, là bội số của 10';
    else if(b>Wl.xu)e=`Bạn chỉ có ${fmt(Wl.xu)} xu`;
    else if(w&&(w.length<4||w.length>12))e='Mật khẩu từ 4 đến 12 ký tự';
    if(e){$('fErr').textContent=e;return}
    const r={id:rid(),owner:ME,H:h,P:p,mins:+$('fT').value,max:n,bet:b,pw:w,n:1,state:'wait',mine:true};ROOMS.unshift(r);$('mask').hidden=true;enterRoom(r,true)}};

/* --- Phòng chờ --- */
let joinT=[];
function enterRoom(r,host){RM=r;RM.host=host;
  const others=host?[]:[{name:r.owner.name,col:r.owner.col,host:1},...FRIENDS.filter(f=>f[0]!==r.owner.name).slice(0,r.n-1).map(f=>({name:f[0],col:f[1]}))];
  RM.players=[...others,{...ME,host:host?1:0}];r.n=RM.players.length;
  view('vWait');renderWait();joinT.forEach(clearTimeout);joinT=[];
  if(host){const pool=FRIENDS.slice();let k=0;for(let i=1;i<r.max;i++)joinT.push(setTimeout(()=>{if(RM!==r||r.state!=='wait')return;const f=pool[k++];RM.players.push({name:f[0],col:f[1]});r.n=RM.players.length;renderWait();toast(f[0]+' đã vào phòng')},1800*i))}
  else joinT.push(setTimeout(()=>{if(RM===r&&r.state==='wait'){toast(r.owner.name+' đã bắt đầu');startGame()}},4500))}
function renderWait(){const r=RM;$('wCode').innerHTML=r.id+(r.pw?' '+LOCK.replace('<svg','<svg style="width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2"'):'');
  $('wSet').innerHTML=[['Phiên xem',r.H],['Phiên chơi',r.P],['Thời gian',r.mins+' phút'],['Cược',r.bet?fmt(r.bet)+' xu':'Không cược']].map(([a,b])=>`<div class="st"><span>${a}</span><b>${b}</b></div>`).join('');
  $('slots').innerHTML=[0,1,2,3].map(i=>{const p=r.players[i];if(p)return `<div class="slot">${av(p,'lg')}<b>${p.name}</b>${p.host?'<small>Chủ phòng</small>':''}</div>`;
    return i<r.max?'<div class="slot empty">Đang chờ người chơi</div>':'<div class="slot empty off">—</div>'}).join('');
  $('bStart').hidden=!r.host;$('bStart').textContent='Bắt đầu'}
$('bCopy').onclick=()=>{try{navigator.clipboard.writeText(RM.id).then(()=>toast('Đã sao chép ID '+RM.id),()=>toast('ID phòng: '+RM.id))}catch(e){toast('ID phòng: '+RM.id)}};
$('bLeave').onclick=()=>{joinT.forEach(clearTimeout);if(RM.host)ROOMS=ROOMS.filter(r=>r!==RM);else RM.n=Math.max(1,RM.n-1);RM=null;view('vLobby');renderLobby()};
$('bStart').onclick=()=>startGame();

/* --- Bắt đầu ván --- */
function startGame(){joinT.forEach(clearTimeout);const r=RM;r.state='play';
  r.solo=r.players.length===1;r.stake=r.solo?0:r.bet;
  if(r.stake){Wl.xu-=r.stake;saveW()}
  const seed=(Math.random()*2**31)|0;H=r.H;P=r.P;genData(seed);
  const R2=rng(seed^99);r.tk=VN30[Math.floor(R2()*VN30.length)];
  const d=new Date(2012+Math.floor(R2()*12),Math.floor(R2()*12),1+Math.floor(R2()*27));const days=[];while(days.length<N){if(d.getDay()%6)days.push(new Date(d));d.setDate(d.getDate()+1)}r.days=days;
  S={step:0,cash:CAP,lots:[],ords:[],fin:false,ind:S.ind,nid:S.nid};
  G={end:Date.now()+r.mins*60000,players:r.players.map(p=>p.me?{...p}:{...p,bot:1,step:0,cash:CAP,lots:[],navs:[CAP],fin:false,sp:0.28+R2()*0.3,r:rng(seed+p.name.length*7+p.col.length)}),over:false,res:null};
  view('vGame');hover=null;side='buy';all(true);toast(r.stake?`Bắt đầu · −${fmt(r.stake)} xu`:'Bắt đầu chơi')}

/* --- Người chơi khác (bản mẫu tự chơi) --- */
const bNav=(b,i)=>b.cash+b.lots.reduce((s,l)=>s+l.q,0)*C[i];
/* % của người khác chỉ tính tới phiên mình đang xem: người đi trước không làm lộ giá các phiên mình chưa mở */
function pnlOf(p){if(p.me)return (navAt(cur())/CAP-1)*100;if(G.over)return (bNav(p,N-1)/CAP-1)*100;
  const k=Math.min(p.step,S.step);return (p.navs[k]/CAP-1)*100}
function botStep(b){if(b.fin)return;b.step++;const i=H-1+b.step,p=C[i],r=b.r;
  const have=b.lots.reduce((s,l)=>s+l.q,0),av2=b.lots.filter(l=>b.step>=l.s+2).reduce((s,l)=>s+l.q,0);
  if(!have&&r()<0.24){const q=Math.floor(b.cash*(0.5+r()*0.5)/(p*(1+FEE)));if(q>0){b.cash-=q*p*(1+FEE);b.lots.push({q,s:b.step})}}
  else if(av2&&r()<0.2){b.cash+=av2*p*(1-FEE-TAX);let k=av2;b.lots.forEach(l=>{if(b.step>=l.s+2){const t=Math.min(l.q,k);l.q-=t;k-=t}});b.lots=b.lots.filter(l=>l.q>0)}
  b.navs[b.step]=bNav(b,i);if(b.step>=P)b.fin=true}
function botsTick(){if(!G||G.over)return;G.players.filter(p=>p.bot&&!p.fin).forEach(b=>{const n=S.fin?3:(b.r()<b.sp?1:0);for(let k=0;k<n;k++)botStep(b)});
  if(S.fin&&G.players.every(p=>p.me||p.fin))endGame();else{renderPbar();if(S.fin)renderWaitOver()}}

/* --- Thanh người chơi và đồng hồ chung --- */
function clockTxt(){const s=Math.max(0,Math.ceil((G.end-Date.now())/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function renderPbar(){if(!G)return;const ps=G.players.map(p=>({p,v:p.me?(S.fin?(navAt(N-1)/CAP-1)*100:pnlOf(p)):pnlOf(p)}));const best=Math.max(...ps.map(x=>x.v));
  const cells=ps.map(({p,v})=>`<div class="pl${p.me?' me':''}${ps.length>1&&Math.abs(v-best)<0.005?' lead':''}">${av(p)}<div class="who"><b>${p.name}</b><span class="pc ${cls(v)}">${pct(v)}</span></div></div>`);
  const low=G.end-Date.now()<60000&&!G.over;
  const clock=`<div class="clock${low?' low':''}"><b id="clk">${G.over?'Kết thúc':clockTxt()}</b></div>`;
  const mid=Math.ceil(cells.length/2);$('pbar').innerHTML=cells.slice(0,mid).join('')+clock+cells.slice(mid).join('')}
function renderWaitOver(){const left=G.players.filter(p=>!p.me&&!p.fin).length;$('waitOver').hidden=!S.fin||G.over;
  $('waitTxt').innerHTML=left?`Còn ${left} người đang chơi`:''}
setInterval(()=>{if(!G||G.over)return;if(Date.now()>=G.end){timeUp();return}botsTick()},1000);
function timeUp(){if(!S.fin){S.step=P;S.fin=true}G.players.forEach(p=>{if(p.bot){p.step=P;p.fin=true}});toast('Hết giờ');endGame()}

/* ===== Giao diện ván chơi ===== */
function renderStats(){const n=cur(),nav=navAt(n),p=(nav/CAP-1)*100;
  $('sPh').textContent=S.step+' / '+P;$('sBar').style.width=(S.step/P*100)+'%';
  $('sNav').textContent=fmt(nav);$('sCash').textContent=fmt(S.cash);renderXu();
  document.querySelectorAll('.qb').forEach(b=>b.style.visibility=!S.fin?'':'hidden');
  const nb=$('bNext');nb.disabled=S.fin&&!(G&&G.over);nb.classList.toggle('fin',S.step===P&&!S.fin);
  nb.innerHTML=G&&G.over?'Xem kết quả':S.fin?'Đã hoàn thành':S.step===P?'Hoàn thành':'Phiên tiếp ▶ <kbd>Space</kbd>'}
function renderHold(){const h=$('hold');if(!S.lots.length){h.innerHTML='<div class="empty">Chưa có cổ phiếu</div>';return}
  h.innerHTML=S.lots.map(l=>{const ok=S.step>=l.s+2,pl=(C[cur()]/l.p-1)*100;return `<div class="lot"><span><b>${fmt(l.q)}</b> cp · giá ${fmt(l.p)} <span class="${cls(pl)}">${pct1(pl)}</span></span>${ok?'<span class="tag ok">Đã về</span>':`<span class="tag wait">Chờ về · ${l.s+2-S.step} phiên</span>`}</div>`}).join('')}
function renderOrds(){$('ords').innerHTML=S.ords.length?S.ords.slice().reverse().map(o=>`<div class="ord"><span>Phiên ${o.s}</span><span><span class="s ${o.t==='buy'?'up':'dn'}">${o.t==='buy'?'Mua':'Bán'}</span> ${fmt(o.q)} cp × ${fmt(o.p)}</span><b>${o.t==='buy'?'−':'+'}${fmt(o.v)}</b></div>`).join(''):'<div class="empty">Chưa có lệnh</div>'}
const maxQty=()=>side==='buy'?Math.floor(S.cash/(px()*(1+FEE))):avail();
function renderOrder(){const buy=side==='buy',q=Math.floor(+$('oQty').value||0),p=px(),v=q*p,fee=v*FEE,tax=buy?0:v*TAX;
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.s===side));
  $('oPx').textContent=fmt(p);$('oMaxL').textContent=buy?'Mua tối đa':'Bán được';$('oMax').textContent=fmt(maxQty())+' cp';
  $('oQty').disabled=S.fin;$('oVal').textContent=fmt(v);$('oFeeL').textContent=buy?'Phí 0,15%':'Phí 0,15% và thuế 0,1%';$('oFee').textContent=fmt(fee+tax);
  $('oTotL').textContent=buy?'Tổng tiền trả':'Tiền nhận về';$('oTot').textContent=fmt(buy?v+fee:v-fee-tax);
  const b=$('bOrd');b.className='btn-ord '+side;b.textContent=buy?'Đặt mua':'Đặt bán';
  let err='';if(S.fin)err='';else if(q>maxQty())err=buy?'Không đủ tiền mặt':(held()>avail()&&q<=held()?'Cổ phiếu mua chưa đủ T+2, chưa bán được':'Vượt số cổ phiếu đang có');
  $('oErr').textContent=q>0||S.fin?err:'';b.disabled=S.fin||q<1||!!err}
function placeOrder(){const q=Math.floor(+$('oQty').value||0);if(q<1||q>maxQty()||S.fin)return;const p=px(),v=q*p;
  if(side==='buy'){const cost=v*(1+FEE);S.cash-=cost;S.lots.push({q,p,s:S.step});S.ords.push({t:'buy',q,p,s:S.step,v:cost})}
  else{let r=q;for(const l of S.lots){if(r<=0)break;if(S.step>=l.s+2){const k=Math.min(l.q,r);l.q-=k;r-=k}}S.lots=S.lots.filter(l=>l.q>0);const got=v*(1-FEE-TAX);S.cash+=got;S.ords.push({t:'sell',q,p,s:S.step,v:got})}
  $('oQty').value='';all(false);toast((side==='buy'?'Đã mua ':'Đã bán ')+fmt(q)+' cp giá '+fmt(p))}
function next(){if(!G)return;if(G.over){$('mask').hidden=false;return}if(S.fin)return;
  if(S.step<P){S.step++;hover=null;all(true)}else{S.fin=true;all(false);if(G.players.every(p=>p.me||p.fin))endGame()}}
function all(fr){draw(fr);renderStats();renderHold();renderOrds();renderOrder();renderPbar();renderWaitOver()}

/* ===== Kết thúc ván ===== */
const dd=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
function endGame(){if(G.over)return;G.over=true;const r=RM;
  /* Ai chưa bấm tới phiên cuối thì giữ nguyên vị thế, tính tại phiên cuối */
  S.fin=true;const fin=G.players.map(p=>({p,v:p.me?(navAt(N-1)/CAP-1)*100:(bNav(p,N-1)/CAP-1)*100}));
  fin.sort((a,b)=>b.v-a.v);const top=Math.round(fin[0].v*100);const win=fin.filter(x=>Math.round(x.v*100)===top);
  const pot=r.stake*fin.length,share=r.stake?Math.floor(pot/win.length):0;
  fin.forEach(x=>{x.w=win.includes(x);x.dx=r.stake?(x.w?share-r.stake:-r.stake):0});
  const meW=fin.find(x=>x.p.me);if(meW.w&&share){Wl.xu+=share;saveW()}
  r.state='done';
  all(false);$('waitOver').hidden=true;
    const title=r.solo?'Kết quả':win.length>1?'Hoà':(meW.w?'Bạn thắng':win[0].p.name+' thắng');
  $('modal').innerHTML=`<h2>${title}</h2>
  <div class="rk2">${fin.map((x,i)=>`<div class="r${x.p.me?' me':''}"><span class="n">${fin.findIndex(y=>Math.round(y.v*100)===Math.round(x.v*100))+1}</span>${av(x.p)}<span class="nm">${x.p.name}</span><b class="${cls(x.v)}">${pct(x.v)}</b>${r.stake&&x.w?`<span class="xu2">+${fmt(share)} xu</span>`:'<span></span>'}</div>`).join('')}</div>
  <div class="rev"><span>Mã cổ phiếu</span><b class="tk">${r.tk}</b>
    <span>Thời gian</span><b>${dd(r.days[0])} – ${dd(r.days[N-1])}</b></div>
  <div class="mact"><button class="g" id="mSee">Xem lại biểu đồ</button><button class="g" id="mBack">Về sảnh</button><button class="p" id="mAgain">Chơi lại</button></div>`;
  $('mask').hidden=false;$('mSee').onclick=()=>$('mask').hidden=true;$('mBack').onclick=backLobby;$('mAgain').onclick=playAgain}
/* Chơi lại: cùng phòng, cùng thiết lập và người chơi; hệ thống chọn mã và giai đoạn mới */
function playAgain(){const r=RM;$('mask').hidden=true;G=null;r.state='wait';
  if(r.stake&&Wl.xu<r.stake){toast(`Không đủ ${fmt(r.stake)} xu để chơi lại`);backLobby();return}
  view('vWait');renderWait();if(!r.host){joinT=[setTimeout(()=>{if(RM===r&&r.state==='wait'){toast(r.owner.name+' đã bắt đầu');startGame()}},4000)]}}
function backLobby(){$('mask').hidden=true;if(RM&&RM.state==='done')ROOMS=ROOMS.filter(x=>x!==RM);G=null;RM=null;view('vLobby');renderLobby()}

/* ===== Sự kiện ===== */
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{side=b.dataset.s;$('oQty').value='';renderOrder()});
$('oQty').oninput=renderOrder;$('oQty').onkeydown=e=>{if(e.key==='Enter')placeOrder()};
$('bOrd').onclick=placeOrder;
document.querySelectorAll('.qb').forEach(b=>b.onclick=()=>{side=b.dataset.s;$('oQty').value='';renderOrder();$('oQty').closest('.box').scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>$('oQty').focus({preventScroll:true}),350)});
$('bNext').onclick=next;
$('railFb').onclick=()=>{if(G&&!G.over){toast('Đang trong ván chơi');return}if(RM){return}backLobby()};

document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(!G||!$('pmask').hidden||!$('imask').hidden||!$('mask').hidden)return;
  if(e.code==='Space'){e.preventDefault();next()}
  else if(e.key==='b'||e.key==='B'){side='buy';renderOrder();$('oQty').focus();e.preventDefault()}
  else if(e.key==='s'||e.key==='S'){side='sell';renderOrder();$('oQty').focus();e.preventDefault()}});
$('mask').onclick=e=>{if(e.target===$('mask')&&!(G&&G.over&&$('mBack')))$('mask').hidden=true};
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}
new ResizeObserver(()=>{if(G)draw(false)}).observe(svg);
renderLobby();

</script>
</body>
</html>
