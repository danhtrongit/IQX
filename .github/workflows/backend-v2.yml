name: backend-v2

on:
  pull_request:
    paths:
      - "backend-v2/**"
      - "backend/app/api/**"
      - "backend/app/models/**"
      - "backend/app/core/**"
      - "backend/app/__init__.py"
      - ".github/workflows/backend-v2.yml"
  push:
    paths:
      - "backend-v2/**"
      - "backend/app/api/**"
      - "backend/app/models/**"
      - "backend/app/core/**"
      - "backend/app/__init__.py"
      - ".github/workflows/backend-v2.yml"

permissions:
  contents: read

concurrency:
  group: backend-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend-v2

jobs:
  quality:
    name: Unit, lint, types, audit, build, contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: backend-v2/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Set up offline schema verification runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install schema-only verification dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_CACHE_DIR: "1"
        run: python -m pip install 'SQLAlchemy==2.0.49' 'pydantic==2.13.3' 'pydantic-settings==2.14.0'

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify API contracts
        run: npm run contracts:check

      - name: Verify complete API route coverage
        run: npm run api:coverage:check

  integration:
    name: Integration (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      TESTCONTAINERS_RYUK_DISABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: backend-v2/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Require Docker
        run: docker info

      - name: Integration tests (Testcontainers PostgreSQL 17 and Redis 7)
        run: npm run test:integration

      - name: System acceptance (Testcontainers PostgreSQL 16 and Redis 8)
        run: npm run test:system
