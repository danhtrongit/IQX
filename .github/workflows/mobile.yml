name: mobile

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/mobile.yml"
  push:
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  quality:
    name: Install, typecheck, lint, test, metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      # These scripts are optional until the mobile app adds dedicated tooling.
      - name: Lint (when configured)
        run: pnpm run lint --if-present

      - name: Unit tests
        run: node --test tests/**/*.test.mjs

      - name: Expo build metadata
        run: pnpm exec expo config --json > /tmp/iqx-mobile-expo-config.json

      - name: Validate Expo metadata is JSON
        run: node -e "JSON.parse(require('fs').readFileSync('/tmp/iqx-mobile-expo-config.json', 'utf8'));"

      - name: Verify shared design tokens
        working-directory: ${{ github.workspace }}
        run: node packages/design-tokens/scripts/check-parity.mjs

      - name: Verify mobile OpenAPI paths
        working-directory: ${{ github.workspace }}
        run: pnpm packages:contracts
