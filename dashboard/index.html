          var t = localStorage.getItem("iqx-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.body.setAttribute("arco-theme", t);
        } catch (e) {
          document.body.setAttribute("arco-theme", "dark");
        }
      })();
    </script>
