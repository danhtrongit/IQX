map $http_upgrade $iqx_v2_connection {
    default upgrade;
    '' close;
}

server {
    listen 103.199.18.160:80;
    server_name trading.iqx.vn;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/iqx-v2/acme;
        try_files $uri =404;
    }
    location / { return 301 https://trading.iqx.vn$request_uri; }
}

server {
    listen 103.199.18.160:443 ssl;
    server_name trading.iqx.vn;
    ssl_certificate /etc/letsencrypt/live/trading.iqx.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trading.iqx.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/iqx-v2/current/frontend-v2/dist;
    index index.html;
    access_log /var/log/nginx/iqx-v2-access.log combined;
    error_log /var/log/nginx/iqx-v2-error.log warn;
    client_max_body_size 510m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/v2/ {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx already validates Cloudflare ranges in cloudflare.inc.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $iqx_v2_connection;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
    location /api/ { return 404; }
    location /media/ {
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /health/live { proxy_pass http://127.0.0.1:3102; access_log off; }
    location = /health/ready { proxy_pass http://127.0.0.1:3102; access_log off; }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location /assets/ { try_files $uri =404; expires 1h; }
    location /charting_library/ { try_files $uri =404; expires 1h; }
    location ~ /\.(?!well-known/) { return 404; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache" always; }
}
